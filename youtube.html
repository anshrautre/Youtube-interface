<!DOCTYPE HTML>
<html>
	<head>
		<title>
			YOUTUBE
		</title>
		<link rel="stylesheet" href="youtube.css">
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css" integrity="sha512-kJlvECunwXftkPwyvHbclArO8wszgBGisiLeuDFwNM8ws+wKIw0sv1os3ClWZOcrEB2eRXULYUsm8OVRGJKwGA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
	</head>
	<body>
		<header>
			<nav>
				<div class="icon">
					<i class="ri-menu-line"></i>
				</div>
				<div class="logo"><i class="ri-youtube-fill"></i></div>
				<div class="font">
					<strong>YOUTUBE</strong><sup>IN</sup>
				</div>
				<div class="search">
					<input type="text" placeholder="	Search...." name="search" class="srch"> 
				</div>
				<div class="mic">
					<i class="ri-mic-line"></i>
				</div>
				<div class="cre">
					<i class="ri-user-add-line mar"></i><span class="span">Create</span>
				</div>
				<div class="not">
					<i class="ri-notification-2-line"></i>
				</div>
				<div class="img1">
					<img src="https://yt3.googleusercontent.com/ytc/AIdro_mhZvfF7IpIyrlXnk5ToLz__6xqwfcOwthsfbwTRMsGafs=s160-c-k-c0x00ffffff-no-rj" class="img">
				</div>
			</nav>
		</header>
		<main>
			<aside>
				<div class="home">
					<center><i class="ri-home-4-fill"></i>
					<figcaption>
						Home
					</figcaption></center>
				</div>
				<div class="shrt">
					<center><i class="ri-video-on-line"></i>
					<figcaption>
						Shorts
					</figcaption>
					</center>
				</div>
				<div class="shrt1">
					<center><i class="ri-user-follow-line"></i>
					<figcaption>
						Subscription
					</figcaption></center>
				</div>
				<div class="shrt2">
					<center><i class="ri-account-circle-line"></i>
					<figcaption>
						You
					</figcaption></center>
				</div>
			</aside>
		</main>
	</body>
</html>
